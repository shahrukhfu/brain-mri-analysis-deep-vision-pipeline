<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Dark tech gradient background -->
    <linearGradient id="bg-grad-unet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>

    <!-- Glowing effects -->
    <filter id="glow-cyan-unet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple-unet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green-unet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 6 5 L 0 8.5 z" fill="#334155" />
    </marker>
  </defs>

  <style>
    .title-unet {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #f8fafc;
    }
    .text-lbl {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 10px;
      fill: #94a3b8;
      text-anchor: middle;
    }
    .block-lbl {
      font-family: 'monospace';
      font-size: 11px;
      font-weight: bold;
      fill: #cbd5e1;
      text-anchor: middle;
    }
    .arrow-line {
      stroke: #334155;
      stroke-width: 1.5;
      fill: none;
    }
    .skip-line {
      stroke: #818cf8;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
      fill: none;
      opacity: 0.6;
    }
    
    /* Keyframes */
    @keyframes pulseGlow {
      0% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.4; transform: scale(0.95); }
    }
    @keyframes signalFlow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .gate-node {
      transform-origin: 390px 140px;
      animation: pulseGlow 3s infinite ease-in-out;
    }
    .att-text {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 9px;
      fill: #34d399;
      text-anchor: middle;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="350" rx="14" fill="url(#bg-grad-unet)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Grid -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.15">
    <path d="M 100 0 L 100 350 M 200 0 L 200 350 M 300 0 L 300 350 M 400 0 L 400 350 M 500 0 L 500 350 M 600 0 L 600 350 M 700 0 L 700 350" />
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300" />
  </g>

  <!-- Title -->
  <text x="30" y="35" class="title-unet">Hybrid CNN-Attention U-Net Architecture</text>
  <text x="30" y="55" class="text-lbl" text-anchor="start" fill="#64748b">Bottleneck Self-Attention &amp; Skip Connection Gating</text>

  <!-- --- NET BLOCKS --- -->

  <!-- 1. Input Image Slice -->
  <g transform="translate(60, 100)">
    <rect width="30" height="120" rx="4" fill="#0ea5e9" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="15" y="-12" class="block-lbl" fill="#38bdf8">Input</text>
    <text x="15" y="65" class="text-lbl" fill="#ffffff" font-weight="bold">T2-FLAIR</text>
  </g>

  <!-- 2. Encoder Stage 1 -->
  <g transform="translate(160, 120)">
    <rect width="25" height="80" rx="4" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5" />
    <text x="12.5" y="-12" class="block-lbl" fill="#818cf8">Enc 1</text>
    <text x="12.5" y="45" class="text-lbl" fill="#94a3b8">128x128</text>
  </g>

  <!-- 3. Encoder Stage 2 -->
  <g transform="translate(260, 140)">
    <rect width="25" height="40" rx="4" fill="#6366f1" fill-opacity="0.4" stroke="#6366f1" stroke-width="1.5" />
    <text x="12.5" y="-12" class="block-lbl" fill="#818cf8">Enc 2</text>
    <text x="12.5" y="25" class="text-lbl" fill="#94a3b8">64x64</text>
  </g>

  <!-- 4. Bottleneck & Attention Block -->
  <g transform="translate(370, 190)">
    <rect width="60" height="30" rx="4" fill="#a855f7" fill-opacity="0.4" stroke="#a855f7" stroke-width="1.5" filter="url(#glow-purple-unet)" />
    <text x="30" y="-12" class="block-lbl" fill="#c084fc">Bottleneck</text>
    <text x="30" y="18" class="text-lbl" fill="#e9d5ff">32x32 + Attention</text>
  </g>

  <!-- 5. Decoder Stage 2 -->
  <g transform="translate(515, 140)">
    <rect width="25" height="40" rx="4" fill="#ec4899" fill-opacity="0.4" stroke="#ec4899" stroke-width="1.5" />
    <text x="12.5" y="-12" class="block-lbl" fill="#f472b6">Dec 2</text>
    <text x="12.5" y="25" class="text-lbl" fill="#94a3b8">64x64</text>
  </g>

  <!-- 6. Decoder Stage 1 -->
  <g transform="translate(615, 120)">
    <rect width="25" height="80" rx="4" fill="#ec4899" fill-opacity="0.3" stroke="#ec4899" stroke-width="1.5" />
    <text x="12.5" y="-12" class="block-lbl" fill="#f472b6">Dec 1</text>
    <text x="12.5" y="45" class="text-lbl" fill="#94a3b8">128x128</text>
  </g>

  <!-- 7. Output Segmented Mask -->
  <g transform="translate(710, 100)">
    <rect width="30" height="120" rx="4" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5" filter="url(#glow-green-unet)" />
    <text x="15" y="-12" class="block-lbl" fill="#34d399">Output</text>
    <text x="15" y="65" class="text-lbl" fill="#ffffff" font-weight="bold">Tumor Mask</text>
  </g>

  <!-- --- CONNECTIONS & FLOW --- -->

  <!-- Feedforward Down-Path -->
  <path class="arrow-line" d="M 90 160 H 160" marker-end="url(#arrow)" />
  <path class="arrow-line" d="M 185 160 L 260 160" />
  <path class="arrow-line" d="M 285 160 L 370 205" />

  <!-- Feedforward Up-Path -->
  <path class="arrow-line" d="M 430 205 L 515 160" />
  <path class="arrow-line" d="M 540 160 L 615 160" />
  <path class="arrow-line" d="M 640 160 H 710" />

  <!-- Skip Connection 1 (Enc1 -> Dec1) -->
  <path id="skip1" class="skip-line" d="M 185 140 H 615" />
  
  <!-- Skip Connection 2 (Enc2 -> AG -> Dec2) -->
  <path id="skip2-left" class="skip-line" d="M 285 150 H 375" />
  <path id="skip2-right" class="skip-line" d="M 405 150 H 515" />

  <!-- Attention Gate (AG) Node sitting on Skip 2 -->
  <g class="gate-node">
    <circle cx="390" cy="150" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" filter="url(#glow-green-unet)" />
    <text x="390" y="153" class="att-text">AG</text>
  </g>
  <!-- Gating signal from Bottleneck/Decoder up to AG -->
  <path class="skip-line" stroke="#10b981" d="M 400 190 Q 390 175 390 166" />



  <!-- --- ANIMATED PARTICLES TRAVERSING SKIPS & PIPELINE --- -->

  <!-- Skip 1 Particle (Slow) -->
  <circle r="4" fill="#818cf8" filter="url(#glow-cyan-unet)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 185 140 H 615" />
  </circle>

  <!-- Skip 2 Left Particle (Medium) -->
  <circle r="4" fill="#818cf8" filter="url(#glow-cyan-unet)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 285 150 H 375" />
  </circle>

  <!-- Attention Gate output particle (Pulsed green, fast) -->
  <circle r="4" fill="#34d399" filter="url(#glow-green-unet)">
    <animateMotion dur="1.5s" begin="1.2s" repeatCount="indefinite" path="M 405 150 H 515" />
  </circle>

  <!-- Gating particle ascending from bottleneck to AG -->
  <circle r="3.5" fill="#10b981" filter="url(#glow-green-unet)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 400 190 Q 390 175 390 166" />
  </circle>

  <!-- Bottleneck activation particle -->
  <circle r="4" fill="#c084fc" filter="url(#glow-purple-unet)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 285 160 L 370 205" />
  </circle>

  <!-- Bottleneck output to Decoder particle -->
  <circle r="4" fill="#f472b6" filter="url(#glow-purple-unet)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 430 205 L 515 160" />
  </circle>

  <!-- Details text on attention gate -->
  <text x="390" y="80" class="text-lbl" fill="#34d399" font-weight="600">Spatial Attention Gate</text>
  <text x="390" y="93" class="text-lbl" fill="#64748b">Prunes skip features by active tumor gating signals</text>
</svg>
